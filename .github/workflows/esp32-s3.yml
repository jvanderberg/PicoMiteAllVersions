name: Build ESP32-S3 firmware

on:
  pull_request:
    paths:
      - '*.c'
      - '*.h'
      - 'buildesp32.sh'
      - 'core/**'
      - 'drivers/**'
      - 'hal/**'
      - 'ports/esp32_s3/**'
      - 'ports/esp32_s3_quad/**'
      - 'ports/esp32_cyd/**'
      - 'runtime/**'
      - 'shared/**'
      - 'third_party/**'
      - 'tools/check_hal_purity.sh'
      - '.github/workflows/esp32-s3.yml'
  push:
    branches: [main]
    paths:
      - '*.c'
      - '*.h'
      - 'buildesp32.sh'
      - 'core/**'
      - 'drivers/**'
      - 'hal/**'
      - 'ports/esp32_s3/**'
      - 'ports/esp32_s3_quad/**'
      - 'ports/esp32_cyd/**'
      - 'runtime/**'
      - 'shared/**'
      - 'third_party/**'
      - 'tools/check_hal_purity.sh'
      - '.github/workflows/esp32-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware (octal + quad + CYD)
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v5.3.5 \
            bash -lc 'git config --global --add safe.directory /project &&
                      . "$IDF_PATH/export.sh" >/dev/null &&
                      ./buildesp32.sh all &&
                      chmod -R a+rw ports/esp32_s3/build ports/esp32_s3/sdkconfig \
                                    ports/esp32_s3_quad/build ports/esp32_s3_quad/sdkconfig \
                                    ports/esp32_cyd/build ports/esp32_cyd/sdkconfig'

      - name: Stage ESP32-S3 artifacts (merged bins only)
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v5.3.5 \
            bash -lc 'set -euo pipefail
                      . "$IDF_PATH/export.sh" >/dev/null
                      mkdir -p artifacts
                      for v in octal quad cyd; do
                        case $v in
                          octal) build=ports/esp32_s3/build;      app=mmbasic_anywhere_esp32_s3.bin;      chip=esp32s3; freq=80m; boot=0x0;    out=MMBasic-Anywhere-esp32-s3-octal-merged.bin ;;
                          quad)  build=ports/esp32_s3_quad/build;  app=mmbasic_anywhere_esp32_s3_quad.bin;  chip=esp32s3; freq=80m; boot=0x0;    out=MMBasic-Anywhere-esp32-s3-quad-merged.bin ;;
                          cyd)   build=ports/esp32_cyd/build;      app=mmbasic_anywhere_esp32_cyd.bin;      chip=esp32;   freq=40m; boot=0x1000; out=MMBasic-Anywhere-esp32-cyd-merged.bin ;;
                        esac
                        python -m esptool --chip "$chip" merge_bin \
                           -o "artifacts/$out" \
                           --flash_mode dio \
                           --flash_freq "$freq" \
                           --flash_size 4MB \
                           "$boot" "$build/bootloader/bootloader.bin" \
                           0x8000 "$build/partition_table/partition-table.bin" \
                           0x10000 "$build/$app"
                      done
                      chmod -R a+rw artifacts'
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: esp32-s3-firmware
          path: release-esp32

      - name: Upload ESP32-S3 artifacts to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          date=$(git log -1 --format=%cI)
          summary=$(git log -1 --format='%s')

          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest

          if ! gh release view latest >/dev/null 2>&1; then
            {
              echo "Rolling build from \`main\`."
              echo ""
              echo "**Commit:** [\`$sha\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) — $summary"
              echo "**Built:** $date"
            } > notes.md
            gh release create latest \
                --title "Latest build" \
                --notes-file notes.md \
                --target "${{ github.sha }}"
          fi

          # Drop assets the build no longer produces (the split bins, flash.txt,
          # and the old single-variant merged image), so the rolling release
          # carries only the two merged bins.
          for stale in MMBasic-Anywhere-esp32-s3-app.bin \
                       MMBasic-Anywhere-esp32-s3-bootloader.bin \
                       MMBasic-Anywhere-esp32-s3-partition-table.bin \
                       MMBasic-Anywhere-esp32-s3-merged.bin \
                       MMBasic-Anywhere-esp32-s3-flash.txt; do
            gh release delete-asset latest "$stale" -y 2>/dev/null || true
          done

          gh release upload latest release-esp32/* --clobber
